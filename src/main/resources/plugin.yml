name: McMMOLevelRewards
version: ${project.version}
main: com.defectivevortex.mcmmorewards.McMMOLevelRewards
api-version: '1.20'
description: Rewards for levelling up mcMMO skills (commands, Vault money, MMOCore XP)
website: https://github.com/DefectiveVortex/MCMMORewards
authors: [DefectiveVortex]
depend: [mcMMO]
softdepend: [Vault, MMOCore]
commands:
  mcmmorewards:
    description: Reload the McMMORewards config
    usage: /<command> reload
    permission: mcmmorewards.reload
permissions:
  mcmmorewards.reload:
    description: Allows reloading the config
    default: op
