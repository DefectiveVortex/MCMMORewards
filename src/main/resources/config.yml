# McMMORewards config
#
# One section per mcMMO skill (upper/lower case doesn't matter). Inside a skill:
#   levels: <level>    pays once, when that exact level is reached
#   every:  <n>        pays at every multiple of n (every: 10 -> 10, 20, 30, ...)
#   <level>: [...]     the old 1.0 style, just a list of commands
#
# A reward can have any of: commands, money (needs Vault), mmocore-xp (needs MMOCore).
# Commands run from the console and can use %player%, %skill% and %level%.
#
# After editing, run /mcmmorewards reload.

rewards:
  mining:
    # Old style: a list of commands straight under the level
    10:
      - "broadcast %player% reached Mining 10!"

    levels:
      25:
        money: 100.0
        commands:
          - "msg %player% You earned $100 for reaching Mining 25!"
      50:
        money: 500.0
        mmocore-xp:
          class: "warrior" # an MMOCore profession id; anything else goes to the main class
          amount: 100
        commands:
          - "broadcast %player% reached Mining 50!"

    every:
      1:
        mmocore-xp:
          class: "main"
          amount: 5
      10:
        money: 50.0
        commands:
          - "msg %player% Keep up the good work! Here is $50."
      100:
        money: 1000.0
        commands:
          - "broadcast %player% is a Mining Master! Level %level%!"

  herbalism:
    every:
      5:
        money: 20.0
